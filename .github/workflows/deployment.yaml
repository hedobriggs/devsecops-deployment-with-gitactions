name: DevSecOps Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------
      # AUTO-FIX NODE DEPENDENCIES
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install npm-check-updates
        run: npm install -g npm-check-updates

      - name: Upgrade all dependencies
        run: ncu -u

      - name: Install updated dependencies
        run: npm install

      - name: Run npm audit fix
        run: npm audit fix || true

      - name: Run npm audit fix --force
        run: npm audit fix --force || true

      # -----------------------------
      # TRIVY FS SCAN
      # -----------------------------
      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db
          TRIVY_DISABLE_VEX_NOTICE: "true"
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0

      # -----------------------------
      # SONARQUBE SCAN
      # -----------------------------
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v3
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_SCANNER_OPTS: "-Dsonar.projectKey=starbucks-app"

      # -----------------------------
      # OWASP DEPENDENCY CHECK
      # -----------------------------
      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "starbucks-app"
          path: "."
          format: "HTML"
          out: "reports"
        continue-on-error: true

      - name: Upload OWASP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report
          path: reports/

      # -------------------------
      # LOGIN TO DOCKER HUB
      # -------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------------------------
      # BUILD DOCKER IMAGE
      # -------------------------
      - name: Build Docker image
        run: |
          TAG=${GITHUB_RUN_NUMBER}
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/starbucks-app:$TAG .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/starbucks-app:$TAG \
                     ${{ secrets.DOCKERHUB_USERNAME }}/starbucks-app:latest

      # -----------------------------
      # TRIVY IMAGE SCAN
      # -----------------------------
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db
          TRIVY_DISABLE_VEX_NOTICE: "true"
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/starbucks-app:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif

      # -----------------------------
      # PUSH IMAGE
      # -----------------------------
      - name: Push Docker image
        run: |
          TAG=${GITHUB_RUN_NUMBER}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/starbucks-app:$TAG
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/starbucks-app:latest

      # -------------------------
      # DEPLOY TO EC2
      # -------------------------
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            CONTAINER=app
            IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/starbucks-app:${{ github.run_number }}

            # Stop and remove old container
            docker rm -f $CONTAINER 2>/dev/null || true

            # Pull new image
            docker pull $IMAGE

            # Run container
            docker run -d \
              --name $CONTAINER \
              -p 80:80 \
              --restart unless-stopped \
              $IMAGE

            # Clean unused images
            docker image prune -af

      # -----------------------------
      # EMAIL NOTIFICATION
      # -----------------------------
      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Pipeline Status: ${{ job.status }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: "GitHub Actions"
          body: |
            Pipeline finished with status: ${{ job.status }}.
