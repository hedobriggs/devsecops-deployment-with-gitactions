name: DevSecOps Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # -----------------------------
      # AUTO-FIX NODE DEPENDENCIES
      # -----------------------------
      - name: Install npm-check-updates
        run: npm install -g npm-check-updates

      - name: Upgrade all dependencies
        run: ncu -u

      - name: Install updated dependencies
        run: npm install

      - name: Run npm audit fix
        run: npm audit fix || true

      - name: Run npm audit fix --force
        run: npm audit fix --force || true

      # -----------------------------
      # TRIVY FS SCAN (source code)
      # -----------------------------
      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db
          TRIVY_DISABLE_VEX_NOTICE: true
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      # -----------------------------
      # SONARQUBE SCAN
      # -----------------------------
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_SCANNER_OPTS: "-Dsonar.projectKey=starbucks-app"

      # -----------------------------
      # OWASP DEPENDENCY CHECK
      # -----------------------------
      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "starbucks-app"
          path: "."
          format: "HTML"
          out: "reports"

      # -------------------------
      # LOGIN TO DOCKER HUB
      # -------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------------------------
      # BUILD DOCKER IMAGE
      # -------------------------
      - name: Build Docker image
        run: |
          TAG=${GITHUB_RUN_NUMBER}
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/starbucks-app:$TAG .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/starbucks-app:$TAG \
                     ${{ secrets.DOCKERHUB_USERNAME }}/starbucks-app:latest

      # -----------------------------
      # TRIVY IMAGE SCAN
      # -----------------------------
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db
          TRIVY_DISABLE_VEX_NOTICE: true
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/starbucks-app:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      # -----------------------------
      # PUSH IMAGE TO DOCKER HUB
      # -----------------------------
      - name: Push Docker image
        run: |
          TAG=${GITHUB_RUN_NUMBER}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/starbucks-app:$TAG
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/starbucks-app:latest

      # -----------------------------
      # DEPLOY TO EC2
      # -----------------------------
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/starbucks-app:latest
            docker stop starbucks || true
            docker rm starbucks || true
            docker run -d -p 80:80 --name starbucks \
              ${{ secrets.DOCKERHUB_USERNAME }}/starbucks-app:latest

      # -----------------------------
      # EMAIL NOTIFICATION
      # -----------------------------
      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Pipeline Status: ${{ job.status }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: "GitHub Actions"
          body: "Pipeline finished with status: ${{ job.status }}."
